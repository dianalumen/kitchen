<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kuchnia</title>
  <meta name="description" content="Lista zakupów, spiżarnia i przepisy. Wspólne, na dwóch telefonach.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kuchnia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <!-- The font never blocks the first paint: system-ui shows until Instrument Sans arrives (swap). -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"></noscript>
  <link rel="stylesheet" href="styles.css">
  <!-- Every module up front, so the import graph loads in one round trip instead of four. Keep in step with SHELL in sw.js. -->
  <link rel="modulepreload" href="app.js">
  <link rel="modulepreload" href="i18n/pl.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/ui.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/backend.js">
  <link rel="modulepreload" href="js/demo.js">
  <link rel="modulepreload" href="js/shell.js">
  <link rel="modulepreload" href="js/gates.js">
  <link rel="modulepreload" href="js/settings.js">
  <link rel="modulepreload" href="js/categories.js">
  <link rel="modulepreload" href="js/parse.js">
  <link rel="modulepreload" href="js/pickers.js">
  <link rel="modulepreload" href="js/drag.js">
  <link rel="modulepreload" href="js/recipes-data.js">
  <link rel="modulepreload" href="js/recipe-editor.js">
  <link rel="modulepreload" href="js/macros.js">
  <link rel="modulepreload" href="js/views/list.js">
  <link rel="modulepreload" href="js/views/pantry.js">
  <link rel="modulepreload" href="js/views/recipes.js">
  <link rel="modulepreload" href="js/views/cook.js">
  <script>
    // Per-device theme and the last known household accent before first paint (no flash).
    try {
      var th = localStorage.getItem("kitchen.theme"), ac = localStorage.getItem("kitchen.accent");
      if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
      if (ac) document.documentElement.dataset.accent = ac;
    } catch (e) {}
    // Outside ?demo, start config.js and supabase-js now, in parallel with the app's modules
    // (the URL must match SUPABASE_JS in app.js).
    if (!/[?&]demo\b/.test(location.search)) {
      ["config.js", "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"].forEach(function (u) {
        var l = document.createElement("link"); l.rel = "preload"; l.as = "script"; l.href = u; document.head.appendChild(l);
      });
    }
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="gate" hidden></div>
  <main id="app" class="app">
    <div id="banner"></div>
    <div id="view" class="view"><div class="boot" aria-busy="true"></div></div>
  </main>
  <div id="tabbar" class="tabbar"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
