<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kuchnia</title>
  <meta name="description" content="Lista zakupów, spiżarnia i przepisy. Wspólne, na dwóch telefonach.">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kuchnia">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Per-device theme and the last known household accent before first paint (no flash).
    try {
      var th = localStorage.getItem("kitchen.theme"), ac = localStorage.getItem("kitchen.accent");
      if (th === "light" || th === "dark") document.documentElement.dataset.theme = th;
      if (ac) document.documentElement.dataset.accent = ac;
    } catch (e) {}
  </script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <div id="gate" hidden></div>
  <main id="app" class="app">
    <div id="banner"></div>
    <div id="view" class="view"><div class="boot" aria-busy="true"></div></div>
  </main>
  <div id="tabbar" class="tabbar"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
