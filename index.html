<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuchnia</title>
  <style>
    :root { color-scheme: light dark; --bg: #FFFFFF; --fg: #1a1a18; --muted: #6b6b66; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #121211; --fg: #f2f2ef; --muted: #9a9a94; }
    }
    body {
      margin: 0; min-height: 100vh; display: grid; place-content: center; text-align: center;
      background: var(--bg); color: var(--fg);
      font-family: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    h1 { margin: 0 0 .5rem; font-size: 2.5rem; font-weight: 600; }
    p { margin: 0; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Kuchnia</h1>
    <p id="status">Sprawdzam konfigurację…</p>
  </main>
  <script src="config.js"></script>
  <script>
    (function () {
      var el = document.getElementById("status");
      var cfg = window.APP_CONFIG;
      if (cfg && cfg.url) {
        var host = "";
        try { host = new URL(cfg.url).host; } catch (e) { host = "(nieprawidłowy adres)"; }
        el.textContent = "Konfiguracja Supabase: jest (" + host + ")";
      } else {
        el.textContent = "Konfiguracja Supabase: brak (config.js)";
      }
    })();
  </script>
</body>
</html>
