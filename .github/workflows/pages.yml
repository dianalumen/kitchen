name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir _site
          # Explicit allow-list: only these paths are published (never supabase/, docs, tools/).
          # Entries that do not exist yet are skipped with a warning; extend the list in each milestone.
          for path in index.html app.js styles.css sw.js manifest.webmanifest icons i18n; do
            if [ -e "$path" ]; then
              cp -r "$path" _site/
            else
              echo "::warning::$path not found, skipping (not created yet)"
            fi
          done
          printf 'window.APP_CONFIG = { url: "%s", key: "%s" };\n' "$SUPABASE_URL" "$SUPABASE_KEY" > _site/config.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
